name: Build macOS (Intel Mac - Big Sur Compatible)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos-intel:
    name: Build macOS (Intel Mac x86_64 - Big Sur+)
    runs-on: macos-13 # macos-13 uses Intel x86_64 runners
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 1. Build Frontend dist first (so PyInstaller can bundle frontend/dist)
      - name: Build Frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      # 2. Build Python Sidecar Backend
      - name: Build Python Sidecar Backend
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller
          cd backend
          pyinstaller --clean --noconfirm lyang-backend.spec
          cd ..
          
          mkdir -p frontend/src-tauri/bin
          if [ -f "backend/dist/lyang-backend" ]; then
            cp backend/dist/lyang-backend frontend/src-tauri/bin/lyang-backend-x86_64-apple-darwin
          else
            cp dist/lyang-backend frontend/src-tauri/bin/lyang-backend-x86_64-apple-darwin
          fi
          chmod +x frontend/src-tauri/bin/lyang-backend-x86_64-apple-darwin
          echo "Created sidecar binary for x86_64-apple-darwin"

      # 3. Build Tauri DMG
      - name: Build Tauri macOS Bundle
        working-directory: frontend
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          npx tauri build --target x86_64-apple-darwin

      - name: Upload Build Artifacts to GitHub Action
        uses: actions/upload-artifact@v4
        with:
          name: LyangPOS-x86_64-apple-darwin-DMG
          path: |
            frontend/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            frontend/src-tauri/target/release/bundle/dmg/*.dmg

      - name: Release to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            frontend/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            frontend/src-tauri/target/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
