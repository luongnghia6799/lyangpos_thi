[package]
name = "backend-rust"
version = "0.1.0"
edition = "2021"
default-run = "backend-rust"

[[bin]]
name = "backend-rust"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.7", features = ["multipart", "macros", "ws"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
tower = { version = "0.4", features = ["util"] }
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "sqlite", "chrono", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bcrypt = "0.15"
scrypt = "0.11"
hex = "0.4"
dotenvy = "0.15"
anyhow = "1.0"
thiserror = "1.0"
base64 = "0.22"
open = "5.3"
md-5 = "0.10"
sha2 = "0.10"
reqwest = { version = "0.13.4", features = ["json"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
futures-util = "0.3.34"
rust-embed = { version = "8.5", features = ["interpolate-folder-path"] }
mime_guess = "2.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true


